name: Shared package

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check. Defaults to the ref that triggered the workflow.
        required: false
        type: string
        default: ''
      bun-version:
        description: Bun version to install. Defaults to the latest release.
        required: false
        type: string
        default: latest
      browser:
        description: Also bundle every entry point for the browser, for packages that run there.
        required: false
        type: boolean
        default: false

jobs:
  package:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # A newer push to the same pull request cancels this job. Other events get a group of their own,
    # so every push to a branch still runs in full.
    concurrency:
      group: ${{ github.workflow }}-package-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout kvalita
        uses: actions/checkout@v7
        with:
          repository: macieklamberski/kvalita
          ref: ${{ job.workflow_sha }}
          path: .kvalita

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build package
        run: bun run build

      # --install-links packs the package the way npm publishes it, so only its published files land
      # in the consumer. Optional peers go in too, as npm skips them and their entry points need them.
      - name: Install package into a consumer
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer && cd consumer
          npm init -y > /dev/null
          mapfile -t peers < <(node "$GITHUB_WORKSPACE/.kvalita/scripts/package-check.mjs" peers "$GITHUB_WORKSPACE")
          npm install --install-links --ignore-scripts "$GITHUB_WORKSPACE" "${peers[@]}"
          node "$GITHUB_WORKSPACE/.kvalita/scripts/package-check.mjs" entries "$GITHUB_WORKSPACE" .

      - name: Load every entry point on each Node.js version
        working-directory: ${{ runner.temp }}/consumer
        run: node "$GITHUB_WORKSPACE/.kvalita/scripts/package-check.mjs" load "$GITHUB_WORKSPACE" .

  # Type-checks every entry point under each TypeScript module resolution, from ESM and CommonJS
  # consumers, and bundles every entry point with Vite.
  types-and-bundlers:
    name: types and bundlers
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # A newer push to the same pull request cancels this job. Other events get a group of their own,
    # so every push to a branch still runs in full.
    concurrency:
      group: ${{ github.workflow }}-types-and-bundlers-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout kvalita
        uses: actions/checkout@v7
        with:
          repository: macieklamberski/kvalita
          ref: ${{ job.workflow_sha }}
          path: .kvalita

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build package
        run: bun run build

      # TypeScript stays on 5: version 6 deprecates the node10 resolution and 7 removes it.
      - name: Install package into a consumer
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer && cd consumer
          npm init -y > /dev/null
          mapfile -t peers < <(node "$GITHUB_WORKSPACE/.kvalita/scripts/package-check.mjs" peers "$GITHUB_WORKSPACE")
          npm install --install-links --ignore-scripts "$GITHUB_WORKSPACE" "${peers[@]}" typescript@5 vite @types/node

      - name: Type-check and bundle every entry point
        working-directory: ${{ runner.temp }}/consumer
        env:
          BROWSER: ${{ inputs.browser && '--browser' || '' }}
        run: |
          script="$GITHUB_WORKSPACE/.kvalita/scripts/package-check.mjs"
          status=0
          for setup in $(node "$script" setups "$GITHUB_WORKSPACE" . $BROWSER); do
            case $setup in
              typescript/*) command="node $script typecheck $GITHUB_WORKSPACE $setup" ;;
              vite/*) command="npx vite build $setup --logLevel warn" ;;
            esac
            echo "::group::$setup"
            if $command; then
              echo "::endgroup::"
              echo "ok $setup"
            else
              echo "::endgroup::"
              echo "::error::$setup failed"
              status=1
            fi
          done
          exit $status
