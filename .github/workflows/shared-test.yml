name: Shared test

on:
  workflow_call:
    inputs:
      bun-version:
        description: Bun version to install. Defaults to the latest release.
        required: false
        type: string
        default: latest
      ref:
        description: Git ref to test. Defaults to the ref that triggered the workflow.
        required: false
        type: string
        default: ''
      codecov-oidc:
        description:
          Upload coverage with an OIDC token instead of CODECOV_TOKEN. The caller job needs `id-token: write`.
        required: false
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run tests with coverage
        run: bun test --coverage --coverage-reporter=lcov

      - name: Upload coverage to Codecov
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ inputs.codecov-oidc }}
          files: ./coverage/lcov.info
