name: Shared test

on:
  workflow_call:
    inputs:
      bun-version:
        description: Bun version to install. Defaults to the latest release.
        required: false
        type: string
        default: latest
      ref:
        description: Git ref to test. Defaults to the ref that triggered the workflow.
        required: false
        type: string
        default: ''

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    # A newer push to the same pull request cancels this job. Other events get a group of their own,
    # so every push to a branch still runs in full.
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run tests with coverage
        run: bun test --coverage --coverage-reporter=lcov

      - name: Upload coverage to Codecov
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
