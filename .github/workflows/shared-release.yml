name: Shared release

on:
  workflow_call:
    inputs:
      branch:
        description: Branch to release from.
        required: false
        type: string
        default: main
      build:
        description: Run `bun run build` before releasing.
        required: false
        type: boolean
        default: false
      config:
        description: Semantic Release config to extend.
        required: false
        type: string
        default: kvalita/semantic-release
      bun-version:
        description: Bun version to install. Defaults to the latest release.
        required: false
        type: string
        default: latest

jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build package
        if: inputs.build
        run: bun run build

      - name: Release and publish package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bunx semantic-release --extends ${{ inputs.config }}
